name: Bzzoiro API Evaluation

# Read-only evaluation only. The evaluator writes ignored files under
# bzzoiro_probe_out/, but never writes to data/, Supabase, issues or pull requests.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Evaluation size
        required: true
        default: standard
        type: choice
        options:
          - quick
          - standard
          - full
      gameweek:
        description: Comparison gameweek (1-38)
        required: true
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: bzzoiro-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/claude/football-data-integration-h3aa69'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out evaluation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/football-data-integration-h3aa69
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'

      - name: Run offline evaluator tests
        run: python -m unittest discover -s scripts/bzzoiro -p 'test_*.py' -v

      - name: Verify API secret exists
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
        run: |
          if [ -z "$BZZOIRO_API_KEY" ]; then
            echo "::error title=Missing secret::BZZOIRO_API_KEY is not configured."
            exit 1
          fi

      - name: Run read-only evaluation
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          EVAL_PRESET: ${{ inputs.preset }}
          EVAL_GAMEWEEK: ${{ inputs.gameweek }}
        run: |
          if ! [[ "$EVAL_GAMEWEEK" =~ ^([1-9]|[12][0-9]|3[0-8])$ ]]; then
            echo "::error title=Invalid gameweek::Expected an integer from 1 to 38."
            exit 2
          fi

          args=(--gameweek "$EVAL_GAMEWEEK" --out bzzoiro_probe_out --strict)
          case "$EVAL_PRESET" in
            quick)
              args+=(--sample-matches 2 --friendly-sample 3 --profile-sample 3 --identity-detail-limit 20)
              ;;
            standard)
              args+=(--sample-matches 5 --friendly-sample 12 --profile-sample 10 --identity-detail-limit 50)
              ;;
            full)
              args+=(--sample-matches 10 --friendly-sample 100 --profile-sample 25 --identity-detail-limit 200)
              ;;
            *)
              echo "::error title=Invalid preset::Unknown preset."
              exit 2
              ;;
          esac
          python scripts/bzzoiro/probe.py "${args[@]}"

      - name: Publish report to job summary
        if: ${{ always() && hashFiles('bzzoiro_probe_out/SECRET_SCAN_OK') != '' }}
        run: |
          if [ -f bzzoiro_probe_out/REPORT.md ]; then
            cat bzzoiro_probe_out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized evaluation results
        if: ${{ always() && hashFiles('bzzoiro_probe_out/SECRET_SCAN_OK') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bzzoiro-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bzzoiro_probe_out/README.md
            bzzoiro_probe_out/REPORT.md
            bzzoiro_probe_out/SUMMARY.json
            bzzoiro_probe_out/RUN_MANIFEST.json
            bzzoiro_probe_out/ENDPOINT_TELEMETRY.json
            bzzoiro_probe_out/openapi_inventory.json
            bzzoiro_probe_out/SECRET_SCAN_OK
          retention-days: 30
          if-no-files-found: error

      - name: Enforce read-only repository state
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- data/)" ]; then
            echo "::error title=Canonical data changed::The evaluator must not create or modify files under data/."
            git status --short --untracked-files=all -- data/
            exit 1
          fi
          git diff --exit-code -- data/
          git diff --exit-code
          unexpected="$(git status --porcelain --untracked-files=all)"
          if [ -n "$unexpected" ]; then
            echo "::error title=Repository files changed::The evaluator may write only ignored bzzoiro_probe_out artifacts."
            git status --short --untracked-files=all
            exit 1
          fi
